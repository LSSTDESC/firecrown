# Public API Report - Pull Request Events
# =======================================
# Runs the public API comparison independently of the full CI suite so that
# the trusted publisher (publish-api-report.yml) can comment as soon as this
# workflow completes, without waiting for the remaining CI jobs.  This workflow
# executes untrusted PR code and therefore has read-only permissions.

name: firecrown-api-changes
on:
  pull_request:

jobs:
  api-changes:
    name: PR public API changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch PR target branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git check-ref-format "refs/heads/$BASE_BRANCH"
          git fetch origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Griffe
        run: python -m pip install griffe==2.3.0
      - name: Report PR API changes
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set +e
          python tools/api_changes.py pr --base "refs/remotes/origin/$BASE_BRANCH" --target "$BASE_BRANCH" --output "$RUNNER_TEMP/api-changes.md" --metadata "$RUNNER_TEMP/metadata.json" --github-actions
          result=$?
          if [[ -f "$RUNNER_TEMP/api-changes.md" ]]; then
            cat "$RUNNER_TEMP/api-changes.md"
            if ! cat "$RUNNER_TEMP/api-changes.md" >> "$GITHUB_STEP_SUMMARY"; then
              echo '::error title=Public API reporting failed::Could not publish the API report to the workflow summary. See the step log.'
              result=2
            fi
          else
            echo '::error title=Public API reporting failed::No API report was generated. Compatibility was not assessed; see job logs.'
            echo 'API comparison failed; compatibility was not assessed. See job logs.' >> "$GITHUB_STEP_SUMMARY"
            result=2
          fi
          exit "$result"
      - name: Upload PR API report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-api-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-changes.md
            ${{ runner.temp }}/metadata.json
          if-no-files-found: error
          retention-days: 14
