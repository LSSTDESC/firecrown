# Public API Report - Pull Request Events
# =======================================
# Runs the public API comparison independently of the full CI suite so that
# the trusted publisher (publish-api-report.yml) can comment as soon as this
# workflow completes, without waiting for the remaining CI jobs.  The analysis
# job executes untrusted PR code and therefore has read-only permissions.  A
# second job publishes the comment directly for same-repository PRs, whose
# pull_request token may write comments; fork PRs never get that token and rely
# on the trusted publisher.

name: firecrown-api-changes
on:
  pull_request:

jobs:
  api-changes:
    name: PR public API changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch PR target branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git check-ref-format "refs/heads/$BASE_BRANCH"
          git fetch origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Griffe
        run: python -m pip install griffe==2.3.0
      - name: Report PR API changes
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set +e
          python tools/api_changes.py pr --base "refs/remotes/origin/$BASE_BRANCH" --target "$BASE_BRANCH" --output "$RUNNER_TEMP/api-changes.md" --metadata "$RUNNER_TEMP/metadata.json" --github-actions
          result=$?
          if [[ -f "$RUNNER_TEMP/api-changes.md" ]]; then
            cat "$RUNNER_TEMP/api-changes.md"
            if ! cat "$RUNNER_TEMP/api-changes.md" >> "$GITHUB_STEP_SUMMARY"; then
              echo '::error title=Public API reporting failed::Could not publish the API report to the workflow summary. See the step log.'
              result=2
            fi
          else
            echo '::error title=Public API reporting failed::No API report was generated. Compatibility was not assessed; see job logs.'
            echo 'API comparison failed; compatibility was not assessed. See job logs.' >> "$GITHUB_STEP_SUMMARY"
            result=2
          fi
          exit "$result"
      - name: Upload PR API report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: public-api-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-changes.md
            ${{ runner.temp }}/metadata.json
          if-no-files-found: error
          retention-days: 14

  # Same-repository PRs can request a write token on pull_request, so they publish
  # from their own run and need no merge to the default branch.  Fork PRs cannot,
  # and continue to rely on the trusted publish-api-report.yml workflow.  This job
  # runs publisher code from the PR branch, so the head-repository condition is a
  # security boundary; the publisher also refuses fork PRs.
  publish-same-repository:
    name: Publish PR public API report
    needs: api-changes
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    # Share one writer per PR with the default-branch publisher.
    concurrency:
      group: public-api-report-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: tools/publish_api_report.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Create or update API report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_REPORT_IN_RUN: 'true'
        run: python tools/publish_api_report.py
