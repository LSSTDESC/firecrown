# Generated from dependencies.yaml by `make deps-sync` -- do not edit.
channels:
  - conda-forge
dependencies:
  - alabaster
  - babel
  - beautifulsoup4 # firecrown-link-checker, run by make docs-linkcheck
  - black
  - camb <2.0
  - clmm
  - compilers # two-phase cosmosis-standard-library installation
  - cosmosis >=3.0,<3.26 # 3.26 .mod files need gfortran 15; camb <2.0 holds compilers at 14
  - cosmosis-build-standard-library
  - coverage
  - deno # quarto rendering
  - dill # required by cobaya, installed from PyPI
  - flake8
  - flake8-docstrings
  - getdist # required by cobaya, installed from PyPI
  - glib
  - graphviz
  - griffe
  - hypothesis
  - jupyter
  - linkchecker
  - lsstdesc-crow
  - matplotlib-base # firecrown sacc view
  - mypy
  - numcosmo >=0.28,<1.0
  - numpy >=2.0,<2.4
  - packaging # required by cobaya and isitgr, installed from PyPI
  - pandas # required by cobaya, installed from PyPI; also the tutorials
  - pip >=20.1 # installs cobaya, which conda-forge does not package
  - pip:
      - cobaya
      - isitgr
  - plotnine
  - portalocker # required by cobaya, installed from PyPI
  - pybobyqa # required by cobaya (as py-bobyqa), installed from PyPI
  - pyccl >=2.8.0
  - pydantic
  - pydantic-core
  - pygobject-stubs <2.18
  - pylint
  - pytest
  - pytest-cov
  - pytest-json-report
  - pytest-xdist
  - python >=3.12
  - python-build
  - pyyaml
  - quarto
  - rapidfuzz # required by cobaya, installed from PyPI
  - requests # required by cobaya, installed from PyPI; also firecrown-link-checker
  - rich
  - sacc >=2.4
  - scipy >=1.13
  - scipy-stubs
  - sphinx
  - sphinx-autoapi
  - sphinx-autodoc-typehints
  - sphinx-rtd-theme
  - sphinxcontrib-apidoc
  - sympy # required by isitgr, installed from PyPI
  - tabulate # imported by numcosmo_py's CLI but not declared by conda-forge's numcosmo 0.28.0; remove once numcosmo declares it
  - tqdm # required by cobaya, installed from PyPI
  - typer
  - types-pyyaml
  - types-requests
  - typing_extensions
